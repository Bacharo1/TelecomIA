<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>TelecomIA - Connexion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="page-login">

<div class="login-container">
    <div class="logo">
        <h1>Telecom<span>IA</span></h1>
        <p>Assistant Documentaire Intelligent</p>
    </div>

    <div class="form-group">
        <label>Identifiant</label>
        <input type="text" id="username" placeholder="Entrez votre identifiant" autocomplete="off">
    </div>

    <div class="form-group">
        <label>Mot de passe</label>
        <input type="password" id="password" placeholder="Entrez votre mot de passe">
    </div>

    <button class="btn-login" id="btnLogin">Se connecter</button>

    <div class="error-msg" id="errorMsg">Identifiants incorrects ou compte inactif.</div>

    <p class="footer-text">Accès réservé au personnel autorisé</p>
</div>

<script src="login.js"></script>
</body>
</html>
